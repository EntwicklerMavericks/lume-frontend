<app-auth-card title="Sistema de Vendas" subtitle="Insira suas credenciais para acessar a plataforma">
  
  @if (errorMessage()) {
    <div class="alert alert-danger" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- E-mail Input -->
    <app-auth-input
      id="email"
      label="E-mail"
      type="email"
      icon="email"
      placeholder="seu-email@dominio.com"
      autocomplete="email"
      formControlName="email"
    ></app-auth-input>

    <!-- Password Input -->
    <app-auth-input
      id="password"
      label="Senha"
      type="password"
      icon="password"
      placeholder="••••••••"
      autocomplete="current-password"
      formControlName="password"
    >
      <a routerLink="/forgot-password" class="forgot-link" label-extra>Esqueci minha senha</a>
    </app-auth-input>

    <!-- Submit Button -->
    <app-auth-button 
      type="submit" 
      [disabled]="loginForm.invalid"
      [loading]="isLoading()"
    >
      <span loading-text>Entrando...</span>
      Entrar
    </app-auth-button>
  </form>

  <div class="auth-footer">
    <p>Não tem uma conta? <a routerLink="/register" class="signup-link">Criar uma conta</a></p>
  </div>
</app-auth-card>
