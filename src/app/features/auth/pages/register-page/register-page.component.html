<app-auth-card title="Criar uma conta" subtitle="Insira seus dados para começar a utilizar a plataforma">
  
  @if (errorMessage()) {
    <div class="alert alert-danger" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  @if (successMessage()) {
    <div class="alert alert-success" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ successMessage() }}</span>
    </div>
  }

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- Nome Completo Input -->
    <app-auth-input
      id="name"
      label="Nome completo"
      type="text"
      icon="user"
      placeholder="Digite seu nome completo"
      autocomplete="name"
      formControlName="name"
    ></app-auth-input>

    <!-- E-mail Input -->
    <app-auth-input
      id="email"
      label="E-mail"
      type="email"
      icon="email"
      placeholder="seu-email@dominio.com"
      autocomplete="email"
      formControlName="email"
    ></app-auth-input>

    <!-- Senha Input -->
    <app-auth-input
      id="password"
      label="Senha"
      type="password"
      icon="password"
      placeholder="Mínimo 8 caracteres"
      autocomplete="new-password"
      formControlName="password"
    ></app-auth-input>

    <!-- Password Strength Indicator -->
    @if (passwordValue) {
      <div class="strength-wrapper">
        <div class="strength-bar-container">
          <div class="strength-bar" [class]="passwordStrength.class" [style.width.%]="passwordStrength.score * 33.3"></div>
        </div>
        <span class="strength-label" [class]="passwordStrength.class">Força da senha: {{ passwordStrength.label }}</span>
      </div>
    }

    <!-- Confirmar Senha Input -->
    <app-auth-input
      id="confirmPassword"
      label="Confirmar senha"
      type="password"
      icon="key"
      placeholder="Repita sua senha"
      autocomplete="new-password"
      formControlName="confirmPassword"
    ></app-auth-input>

    <!-- Submit Button -->
    <app-auth-button 
      type="submit" 
      [disabled]="registerForm.invalid"
      [loading]="isLoading()"
    >
      <span loading-text>Criando conta...</span>
      Criar conta
    </app-auth-button>
  </form>

  <div class="auth-footer">
    <p>Já possui uma conta? <a routerLink="/login" class="login-link">Fazer login</a></p>
  </div>
</app-auth-card>
