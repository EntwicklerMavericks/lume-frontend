<app-auth-card title="Recuperar senha" subtitle="Insira seu e-mail cadastrado e enviaremos as instruções para redefinir sua senha">
  
  @if (errorMessage()) {
    <div class="alert alert-danger" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  @if (successMessage()) {
    <div class="alert alert-success" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ successMessage() }}</span>
    </div>
  }

  <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
    <!-- E-mail Input -->
    <app-auth-input
      id="email"
      label="E-mail"
      type="email"
      icon="email"
      placeholder="seu-email@dominio.com"
      autocomplete="email"
      formControlName="email"
    ></app-auth-input>

    <!-- Submit Button -->
    <app-auth-button 
      type="submit" 
      [disabled]="forgotForm.invalid"
      [loading]="isLoading()"
    >
      <span loading-text>Enviando...</span>
      Enviar instruções
    </app-auth-button>
  </form>

  <div class="auth-footer">
    <p>Lembrou da senha? <a routerLink="/login" class="login-link">Voltar ao login</a></p>
  </div>
</app-auth-card>
