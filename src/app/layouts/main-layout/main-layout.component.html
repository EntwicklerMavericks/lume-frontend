<div class="layout-wrapper" [class.sidebar-collapsed]="isSidebarCollapsed()">
  <!-- Sidebar -->
  <aside class="sidebar-container">
    <div class="sidebar-header">
      @if (!isSidebarCollapsed()) {
        <div class="brand-logo">
          <img [src]="storeConfig.logoUrl" [alt]="storeConfig.name" class="admin-brand-img" />
          <span class="brand-text">{{ storeConfig.name }}</span>
        </div>
      } @else {
        <div class="brand-logo-collapsed">
          <img [src]="storeConfig.logoUrl" [alt]="storeConfig.name" class="admin-brand-img-collapsed" />
        </div>
      }
      
      <!-- Toggle button -->
      <button class="toggle-sidebar-btn" (click)="toggleSidebar()" aria-label="Recolher menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="toggle-icon">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
    </div>

    <!-- Navigation Scroll area -->
    <div class="sidebar-body">
      <app-menu [isCollapsed]="isSidebarCollapsed()"></app-menu>
    </div>

    <!-- Sidebar footer -->
    <div class="sidebar-footer">
      <button class="logout-btn" (click)="onLogout()" aria-label="Sair">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logout-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        @if (!isSidebarCollapsed()) {
          <span class="logout-text">Sair do ERP</span>
        }
      </button>
    </div>
  </aside>

  <!-- Workspace Container next to sidebar -->
  <div class="workspace-container">
    <app-cabecalho class="workspace-header"></app-cabecalho>
    
    <main class="workspace-content">
      <div class="content-limiter">
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Mobile Bottom App Dock Navigation -->
    <nav class="mobile-bottom-nav">
      <a 
        routerLink="/admin/products" 
        routerLinkActive="active" 
        class="bottom-nav-item"
        aria-label="Produtos"
      >
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l-7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </div>
        <span class="bottom-nav-label">Produtos</span>
      </a>

      <a 
        routerLink="/admin/categories" 
        routerLinkActive="active" 
        class="bottom-nav-item"
        aria-label="Categorias"
      >
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
          </svg>
        </div>
        <span class="bottom-nav-label">Categorias</span>
      </a>

      <a 
        routerLink="/" 
        class="bottom-nav-item"
        title="Visualizar a loja pública"
        aria-label="Ver Loja"
      >
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span class="bottom-nav-label">Ver Loja</span>
      </a>

      <button 
        type="button" 
        class="bottom-nav-item logout-bottom-item" 
        (click)="onLogout()"
        aria-label="Sair"
      >
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>
        <span class="bottom-nav-label">Sair</span>
      </button>
    </nav>
  </div>
</div>
